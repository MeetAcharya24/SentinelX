[project]
name = "sentinelx-backend"
version = "0.1.0"
description = "SentinelX API: defensive security analytics for authorised logs and network datasets."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
# Queries here are built only from fixed column names and constants; values are bound parameters.
"app/storage/alerts.py" = ["S608"]
